[package]
name = "rs-zstd2raw4wasm"
version = "0.1.0"
edition = "2024"

exclude = [
]

[lib]
crate-type = ["cdylib"]

[profile.release-wasm]
inherits = "release"
lto = true
strip = true
opt-level = 's'
codegen-units = 1

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
unwrap_used = "forbid"
expect_used = "forbid"
panic = "forbid"

[dependencies.ruzstd]
version = "0.9.0"
default-features = false
features = [
  "std",
]
